# Local infrastructure for development.
# Start:  docker compose up -d
# Stop:   docker compose down        (data is kept)
# Reset:  docker compose down -v     (deletes all data)
services:
  postgres:
    image: postgres:17
    container_name: agent-harness-postgres
    environment:
      POSTGRES_DB: agent_harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness   # local dev only, never used anywhere real
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d agent_harness"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka in KRaft mode: a single node acting as both broker and controller, no Zookeeper.
  kafka:
    image: apache/kafka:3.9.1
    container_name: agent-harness-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092   # the address our app connects to
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # One node, so internal topics can only have one copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"     # keep it small for an 8 GB laptop
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ---- Observability (optional): docker compose --profile observability up -d ----
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: agent-harness-prometheus
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the app runs on the host, not in Docker

  grafana:
    image: grafana/grafana:11.3.1
    container_name: agent-harness-grafana
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # local dev only: no login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agent-harness.json
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres-data:
  kafka-data:
