spring:
  application:
    name: agent-harness

  datasource:
    # ${NAME:default} = read the environment variable NAME, or use the default for local dev
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_harness}
    username: ${DB_USER:harness}
    password: ${DB_PASSWORD:harness}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match the tables
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                       # the broker must confirm it has stored the message
    consumer:
      group-id: agent-workers         # all workers share the runs between them
      auto-offset-reset: earliest     # a brand-new group starts from the first message
      enable-auto-commit: false       # never move the bookmark on a timer...
      properties:
        session.timeout.ms: 10000     # notice a dead worker within 10s (default 45s)
        heartbeat.interval.ms: 3000
    listener:
      ack-mode: record                # ...move it only after each run has been fully processed

llm:
  # Any OpenAI-compatible provider works; change these three to switch provider.
  base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
  model: ${LLM_MODEL:openai/gpt-oss-120b}
  # Read from the LLM_API_KEY environment variable. Never write the key here.
  api-key: ${LLM_API_KEY:}
  timeout: 60s
  # Randomness: 0 = most consistent, 1+ = more creative. Investigations want consistency.
  temperature: 0.1

agent:
  # Budgets per run. When one runs out, the run stops as FAILED with the reason.
  max-tokens: ${AGENT_MAX_TOKENS:30000}       # counts tokens spent before a crash too
  max-duration: ${AGENT_MAX_DURATION:3m}
  step-delay: ${AGENT_STEP_DELAY:0s}          # demo only: pause between steps

management:
  endpoints:
    web:
      exposure:
        include: health,info
