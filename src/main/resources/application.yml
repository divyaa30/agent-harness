spring:
  application:
    name: agent-harness

  datasource:
    # ${NAME:default} = read the environment variable NAME, or use the default for local dev
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_harness}
    username: ${DB_USER:harness}
    password: ${DB_PASSWORD:harness}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match the tables
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

llm:
  # Any OpenAI-compatible provider works; change these three to switch provider.
  base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
  model: ${LLM_MODEL:openai/gpt-oss-120b}
  # Read from the LLM_API_KEY environment variable. Never write the key here.
  api-key: ${LLM_API_KEY:}
  timeout: 60s
  # Randomness: 0 = most consistent, 1+ = more creative. Investigations want consistency.
  temperature: 0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info
